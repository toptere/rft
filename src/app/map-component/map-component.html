<main class="map-component">
  <header class="toolbar">
    <div class="brand">
      <span class="brand-icon">⌖</span>
      <div>
        <h1>RFT - 0.1</h1>
        <p>{{ status }}</p>
      </div>
    </div>

    <div class="actions">
      <button
        [class.active]="mode === 'road'"
        (click)="setMode('road')">
        Road
      </button>
      <button
        [class.active]="mode === 'satellite'"
        (click)="setMode('satellite')">
        Satellite
      </button>
      <button
        class="locate"
        (click)="locateMe()"
        aria-label="Find my location"
        title="Find my location">
        ⊙
      </button>
    </div>
  </header>

  <section class="map-container">
    <div id="map"></div>
  </section>
</main>
